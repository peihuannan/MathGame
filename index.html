<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍭 彩虹算术糖果屋 (存档版) 🍭</title>
    <style>
        :root {
            --pink: #FF85A2;
            --blue: #B3E5FC;
            --yellow: #FFD54F;
            --green: #A5D6A7;
            --brown: #5D4037;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #F0F4C3;
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        #game-app {
            width: 100%; max-width: 450px;
            background: white; border-radius: 40px;
            border: 6px solid var(--pink);
            position: relative; padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 5;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #FFF9C4; padding: 8px 15px;
            border-radius: 20px; font-weight: bold; color: var(--brown);
            border: 2px solid var(--yellow);
        }

        #store-btn {
            background: var(--green); color: white; border: none;
            padding: 8px 18px; border-radius: 20px;
            font-weight: bold; cursor: pointer; font-size: 16px;
            box-shadow: 0 4px 0 #81C784;
        }

        #question-card {
            background: #F3E5F5; border-radius: 25px;
            padding: 30px 10px; margin-bottom: 25px;
            border: 3px dashed #9575CD; text-align: center;
            transition: all 0.2s;
        }

        /* 答错时的抖动动画 */
        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #question-text {
            font-size: 70px; font-weight: 900; margin: 0;
            background: linear-gradient(to bottom, #FF4081, #7C4DFF);
            -webkit-background-clip: text; color: transparent;
        }

        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

        .opt-btn {
            background: var(--blue); border: none; border-radius: 25px;
            font-size: 40px; font-weight: bold; color: white;
            padding: 20px 0; cursor: pointer;
            box-shadow: 0 8px 0 #81D4FA; position: relative;
        }
        .opt-btn:active { top: 4px; box-shadow: 0 4px 0 #81D4FA; }
        .opt-btn:nth-child(2) { background: var(--yellow); box-shadow: 0 8px 0 #FBC02D; color: var(--brown); }
        .opt-btn:nth-child(3) { background: var(--pink); box-shadow: 0 8px 0 #F06292; }

        /* 答对反馈 */
        #ani-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85); border-radius: 34px;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 20; pointer-events: none;
        }

        .celebrate-icon { font-size: 100px; animation: bounce 0.6s infinite; }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 商店 */
        #store-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #E1F5FE; z-index: 100;
            display: none; flex-direction: column; padding: 20px; box-sizing: border-box;
        }

        .store-header {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 15px; border-radius: 20px; margin-bottom: 20px;
        }

        .gift-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            overflow-y: auto; padding-bottom: 30px;
        }

        .gift-card {
            background: white; border-radius: 20px; padding: 15px;
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .gift-card button {
            background: var(--pink); color: white; border: none;
            padding: 8px 12px; border-radius: 12px; margin-top: 10px; cursor: pointer;
        }

        #canvas-candy {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 200;
        }
    </style>
</head>
<body>

    <div id="game-app">
        <div class="top-bar">
            <div class="stat-box">🌟 关卡 <span id="lvl">1</span></div>
            <div class="stat-box">🍬 <span id="scr">0</span></div>
            <button id="store-btn" onclick="openStore()">🎁 换礼物</button>
        </div>

        <div id="question-card">
            <p id="question-text">1 + 1</p>
        </div>

        <div class="options-grid" id="options-box"></div>

        <div id="ani-overlay">
            <div class="celebrate-icon" id="ani-icon">🍮</div>
            <h2 style="color:var(--pink)">太棒啦！+10🍬</h2>
        </div>
    </div>

    <div id="store-page">
        <div class="store-header">
            <h2 style="margin:0">糖果商店</h2>
            <div class="stat-box">我的糖果: <span id="store-scr">0</span></div>
            <button onclick="closeStore()" style="border:none; background:#ccc; padding:8px 15px; border-radius:10px;">返回</button>
        </div>
        <div class="gift-grid" id="gift-grid"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button onclick="resetGame()" style="background:none; border:none; color:#999; text-decoration:underline;">清空进度重新开始</button>
        </div>
    </div>

    <canvas id="canvas-candy"></canvas>

    <script>
        // --- 存档逻辑 ---
        let score = parseInt(localStorage.getItem('math_candy_score')) || 0;
        let level = parseInt(localStorage.getItem('math_candy_level')) || 1;
        
        let curAns = 0;
        let isWaiting = false;

        const gifts = [
            { n: '漂亮贴纸', i: '🎫', c: 50 },
            { n: '巧克力', i: '🍫', c: 150 },
            { n: '奥特曼/公主人偶', i: '🧸', c: 500 },
            { n: '去游乐园', i: '🎡', c: 1000 }
        ];

        function saveData() {
            localStorage.setItem('math_candy_score', score);
            localStorage.setItem('math_candy_level', level);
        }

        function init() {
            updateUI();
            renderGifts();
            newQuestion();
        }

        function newQuestion() {
            isWaiting = false;
            document.getElementById('ani-overlay').style.display = 'none';
            
            let a, b, op;
            // 难度根据保存的关卡自动调整
            if (level < 5) {
                op = '+';
                a = Math.floor(Math.random() * 5) + 1;
                b = Math.floor(Math.random() * (6 - a)) + 1;
            } else {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') {
                    a = Math.floor(Math.random() * 8) + 1;
                    b = Math.floor(Math.random() * (10 - a)) + 1;
                } else {
                    a = Math.floor(Math.random() * 9) + 2;
                    b = Math.floor(Math.random() * (a - 1)) + 1;
                }
            }

            curAns = op === '+' ? (a + b) : (a - b);
            document.getElementById('question-text').innerText = `${a} ${op} ${b}`;
            
            let opts = [curAns];
            while(opts.length < 3) {
                let f = curAns + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random()*2)+1);
                if(f >= 0 && !opts.includes(f)) opts.push(f);
            }
            opts.sort(() => Math.random() - 0.5);

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            opts.forEach(v => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = v;
                btn.onclick = () => check(v);
                box.appendChild(btn);
            });
        }

        function check(v) {
            if(isWaiting) return;
            if(v === curAns) {
                isWaiting = true;
                score += 10;
                // 每对5道题升一级
                if(score > 0 && score % 50 === 0) level++;
                
                saveData(); // 保存进度
                updateUI();
                
                const ani = document.getElementById('ani-overlay');
                ani.style.display = 'flex';
                dropCandies();
                setTimeout(newQuestion, 1500);
            } else {
                const card = document.getElementById('question-card');
                card.classList.add('shake');
                card.style.backgroundColor = '#FFEBEE';
                setTimeout(() => {
                    card.classList.remove('shake');
                    card.style.backgroundColor = '#F3E5F5';
                }, 300);
            }
        }

        function updateUI() {
            document.getElementById('scr').innerText = score;
            document.getElementById('store-scr').innerText = score;
            document.getElementById('lvl').innerText = level;
        }

        function openStore() { document.getElementById('store-page').style.display = 'flex'; }
        function closeStore() { document.getElementById('store-page').style.display = 'none'; }

        function renderGifts() {
            const grid = document.getElementById('gift-grid');
            grid.innerHTML = gifts.map(g => `
                <div class="gift-card">
                    <div style="font-size:40px">${g.i}</div>
                    <div style="font-weight:bold">${g.n}</div>
                    <div style="color:var(--pink)">${g.c} 🍬</div>
                    <button onclick="buy('${g.n}', ${g.c})">兑换</button>
                </div>
            `).join('');
        }

        function buy(name, cost) {
            if(score >= cost) {
                score -= cost;
                saveData(); // 兑换后扣分并保存
                updateUI();
                alert(`🎉 成功兑换【${name}】！\n找爸爸妈妈领礼物吧！`);
            } else {
                alert(`糖果还不够哦，再努力做对几道题吧！`);
            }
        }

        function resetGame() {
            if(confirm("确定要删除所有糖果和进度，重新开始吗？")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- 糖果雨动画 ---
        const canvas = document.getElementById('canvas-candy');
        const ctx = canvas.getContext('2d');
        let parts = [];
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();

        function dropCandies() {
            const items = ["🍬","🍭","⭐","🍩","🎈"];
            for(let i=0; i<30; i++) {
                parts.push({
                    x: window.innerWidth/2, y: window.innerHeight/2,
                    txt: items[Math.floor(Math.random()*items.length)],
                    vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*25-5,
                    g: 0.5, sz: Math.random()*20+25
                });
            }
        }

        function anim() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            parts.forEach((p, i) => {
                p.vy += p.g; p.x += p.vx; p.y += p.vy;
                ctx.font = p.sz + "px serif";
                ctx.fillText(p.txt, p.x, p.y);
                if(p.y > canvas.height) parts.splice(i, 1);
            });
            requestAnimationFrame(anim);
        }
        anim();
        init();
    </script>
</body>
</html>
